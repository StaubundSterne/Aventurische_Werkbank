                            total += sign * (Math.floor(Math.random() * sides) + 1);
                        }
                    }

                    remaining = remaining.slice(match[0].length);
                    firstTerm = false;
                }

                return total;
            }

            function performDefense(defenderId, type, defenseVal) {
                const defender = activeCombatants.find(c => c.id === defenderId);
                if (!defender) return;

                const effectiveDefenseVal = Number.isFinite(defenseVal)
                    ? defenseVal
                    : null;

                if (effectiveDefenseVal === null) return;

                // Prüfen, ob überhaupt ein Angriff abgewehrt werden kann.
                const hasPendingAttack = defender.pendingAttacks.length > 0;

                // Zusätzlichen Modifikator berücksichtigen.
                const bonus = Number(defender.defenseBonusInput) || 0;
                const finalDefenseVal = Math.max(0, effectiveDefenseVal + bonus);

                // Manuellen Würfelwurf verwenden oder automatisch würfeln.
                let roll;

                const manualRoll = String(defender.defenseRollInput ?? "").trim();

                if (manualRoll !== "") {
                    roll = Number(manualRoll);

                    if (!Number.isInteger(roll) || roll < 1 || roll > 20) {
                        logArenaAction(
                            `⚠️ Ungültiger Verteidigungswurf für <b>${defender.name}</b>. Bitte einen Wert von 1 bis 20 eingeben.`
                        );
                        return;
                    }
                } else {
                    roll = Math.floor(Math.random() * 20) + 1;
                }

                // Eine tatsächliche Verteidigung erhöht den Mehrfachverteidigungszähler.
                const activeMalus = defender.defensesUsedThisRound * 3;

                const incomingAttack = hasPendingAttack
                    ? defender.pendingAttacks.shift()
                    : null;

                if (incomingAttack) {
                    defender.defensesUsedThisRound++;
                }

                let isSuccess = roll === 1 ||
                    (roll !== 20 && roll <= finalDefenseVal);

                let resultStr = "";

                if (roll === 1) {
                    resultStr = "🌟 KRITISCHE VERTEIDIGUNG (Passierschlag-Chance!)";
                } else if (roll === 20) {
                    resultStr = "💀 VERTEIDIGUNGS-PATZER";
                } else if (isSuccess) {
                    resultStr = `🛡️ ${type} GELUNGEN (Wurf: ${roll} <= ${finalDefenseVal})`;
                } else {
                    resultStr = `❌ ${type} MISSGLÜCKT (Wurf: ${roll} > ${finalDefenseVal})`;
                }

                if (!hasPendingAttack) {
                    resultStr += " – kein offener Angriff, kein Schaden";
                } else {
                    resultStr += `, Mehrfachverteidigung: -${activeMalus}`;
                }

                if (bonus !== 0) {
                    resultStr += `, Zusatzmodifikator: ${bonus > 0 ? "+" : ""}${bonus}`;
                }

                logArenaAction(
                    `[Verteidigung] <b>${defender.name}</b> führt ${type} aus: ${resultStr}`
                );

                // Ohne offenen Angriff wird niemals Schaden verursacht.
                if (!hasPendingAttack) {
                    renderArenaCards();
                    return;
                }

                // Bei misslungener Verteidigung Schaden des konkreten Angriffs abwickeln.
                if (!isSuccess && incomingAttack) {
                    let tpRolled = 5;

                    const rolledDamage = rollDamageFormula(incomingAttack.damageFormula);

                    if (rolledDamage !== null) {
                        tpRolled = rolledDamage;
                    }

                    const rs = Number(defender.rs) || 0;
                    const sp = Math.max(0, tpRolled - rs);

                    defender.leCurrent = Math.max(0, defender.leCurrent - sp);
                    checkPainThreshold(defender);

                    logArenaAction(
                        `💥 <b>Schadensrechner:</b> ${incomingAttack.weaponTitle} trifft ${defender.name}! TP: ${tpRolled} - RS: ${rs} = <b>${sp} SP</b> abgezogen. Verbleibende LeP: ${defender.leCurrent}/${defender.leMax}.`
                    );
                }

                renderArenaCards();
            }

            // 8. Gendersensitives Protokoll
            function logArenaAction(msg) {
                const logBox = document.getElementById('arenaLog');
                const timeStr = new Date().toLocaleTimeString();
                logBox.innerHTML += `<div>[${timeStr}] ${msg}</div>`;
                logBox.scrollTop = logBox.scrollHeight;
            }

            // 9. EIN- UND AUSKLAPP-STEUERUNG
            function toggleNav() {
                const nav = document.getElementById('masterNav');
                const expandNavBtn = document.getElementById('expandNavBtn');
                nav.classList.toggle('collapsed');

                if (nav.classList.contains('collapsed')) {
                    expandNavBtn.classList.add('visible');
                } else {
                    expandNavBtn.classList.remove('visible');
                }
            }

            function toggleSidebar() {
                const sidebar = document.getElementById('mainSidebar');
                const expandBtn = document.getElementById('expandSidebarBtn');

                sidebar.classList.toggle('collapsed');

                if (sidebar.classList.contains('collapsed')) {
                    expandBtn.classList.add('visible');
                } else {
                    expandBtn.classList.remove('visible');
                }
            }
        </script>
</body>

</html>
